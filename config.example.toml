# Copier ce fichier en « config.toml » (jamais publié sur GitHub) et le compléter.

[clover]
# Identifiant marchand (13 caractères) visible dans l'URL du tableau de bord Clover.
merchant_id = ""
# Jeton API généré dans Clover : Compte et configuration > Jetons API.
api_token = ""
# Amérique du Nord (Canada et États-Unis)
base_url = "https://api.clover.com"
# Point de vente n° 1 (facultatif) : nom affiché, client et dépôt Sage ; ses factures s'appellent « Vente … »
# nom = "Sherbrooke"
# client_sage = "Vente Hebdomadaire"
# depot_sage = "Emplacement par défaut"

# Autres points de vente Clover : un bloc par point de vente (page « 1. Clover », carte « Points de vente »).
# Chacun est un dépôt (emplacement d'inventaire) dans Sage, avec son client et ses factures « <préfixe> AAAA-MM-JJ ».
# Jeton API dans le coffre-fort Windows (« clover_jeton_<code> »), jamais ici.
# [[points_vente]]
# code = "2"
# nom = "Magasin 2"
# merchant_id = ""
# client_sage = "Vente Magasin 2"
# depot_sage = "Magasin 2"
# prefixe = "V2"      # 5 caractères au plus
# actif = true

[general]
fuseau_horaire = "America/Toronto"

[sage]
# Liste des articles exportée de Sage 50 (Fichier > Importer/Exporter > Exporter)
articles = 'donnees\Article.txt'

[sage_base]
# Lecture directe de Sage 50 (Sage doit être ouvert sur le fichier de l'entreprise).
# Utilisateur Sage avec le droit « Accès par des tiers : lecture seule ».
utilisateur = ""
mot_de_passe = ""
port = 13540
# Fichier d'entreprise à lire (la bonne base est retrouvée même si plusieurs fichiers sont ouverts)
fichier_entreprise = ''

[sage_import]
# Fichier d'entreprise dans lequel importer (.SAI). Pour les essais : la COPIE, jamais l'original.
fichier_entreprise = ''
# Format du fichier .IMP (à ajuster si Sage refuse l'import)
version = "12001"  # 33101 refusé par Sage 2026.2
pays = "1"
position_numero = 3  # n° de facture en 3e champ (en 2e, Sage l ignore et numérote lui-même)
# Import dans un autre dépôt que « Emplacement par défaut » : à mettre à true après un essai réussi sur la copie
depots_valides = false

[factures_courriel]
# Factures fournisseurs jointes aux courriels de la boîte [boite_paiements] (lecture seule) -> page 8
expediteurs = ""   # adresses ou domaines, séparés par des virgules ; vide = sujet ou fichier qui parle de facture
depuis = "2026-10-01"
automatique = true  # aussi pendant le traitement de nuit

[automatique]
# Premier jour à importer si Sage ne contient encore aucune facture « Vente AAAA-MM-JJ »
date_depart = "2026-05-01"
heure = "01:00"
delai_import = 3600

[courriel]
# Alertes : serveur d'envoi (ex. smtp.office365.com port 587 starttls, smtp.gmail.com port 587 starttls)
serveur = ""
port = 587
securite = "starttls"
utilisateur = ""
expediteur = ""
destinataires = ""
copie = ""  # « Autres destinataires » (en copie, CC), séparés par des virgules
envoyer_si_succes = true
