# Copier ce fichier en « config.toml » (jamais publié sur GitHub) et le compléter.

[clover]
# Identifiant marchand (13 caractères) visible dans l'URL du tableau de bord Clover.
merchant_id = ""
# Jeton API généré dans Clover : Compte et configuration > Jetons API.
api_token = ""
# Amérique du Nord (Canada et États-Unis)
base_url = "https://api.clover.com"

[general]
fuseau_horaire = "America/Toronto"

[sage]
# Liste des articles exportée de Sage 50 (Fichier > Importer/Exporter > Exporter)
articles = 'donnees\Article.txt'

[sage_base]
# Lecture directe de Sage 50 (Sage doit être ouvert sur le fichier de l'entreprise).
# Utilisateur Sage avec le droit « Accès par des tiers : lecture seule ».
utilisateur = ""
mot_de_passe = ""
port = 13540
# Fichier d'entreprise à lire (la bonne base est retrouvée même si plusieurs fichiers sont ouverts)
fichier_entreprise = ''

[sage_import]
# Fichier d'entreprise dans lequel importer (.SAI). Pour les essais : la COPIE, jamais l'original.
fichier_entreprise = ''
# Format du fichier .IMP (à ajuster si Sage refuse l'import)
version = "12001"  # 33101 refusé par Sage 2026.2
pays = "1"
position_numero = 3  # n° de facture en 3e champ (en 2e, Sage l ignore et numérote lui-même)
